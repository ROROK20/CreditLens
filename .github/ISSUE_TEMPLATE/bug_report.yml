name: Bug Report
description: Report a problem with CreditLens
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue quickly.

        ⚠️ **Do not report security vulnerabilities here.** See our
        [Security Policy](https://github.com/ROROK20/CreditLens/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I call /score with ..., the API returns ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code/curl snippet that triggers the bug.
      placeholder: |
        1. Run `uvicorn creditlens.api.app:app --port 8002`
        2. POST to /score with payload ...
        3. See error
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: e.g. API, models, fairness, explainability, data generator, frontend
      placeholder: creditlens.api
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: CreditLens version or git commit SHA.
      placeholder: "0.1.0"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and (if relevant) Node.js version.
      placeholder: |
        - OS: macOS 14.5
        - Python: 3.12.5
        - Node: 20.11.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Paste any relevant error output. This is automatically formatted as code.
      render: shell
    validations:
      required: false
