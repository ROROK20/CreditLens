name: Feature Request
description: Suggest an idea or enhancement for CreditLens
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem you're
        trying to solve so we can evaluate the best approach.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Is your request related to a frustration?
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of CreditLens does this affect?
      options:
        - Scoring models
        - Feature engineering
        - SHAP explainability
        - Fairness audit
        - REST API
        - Synthetic data generator
        - Web frontend
        - Docs / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, references, or screenshots here.
    validations:
      required: false
